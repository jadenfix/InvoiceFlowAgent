# Same canonical runtime, with an explicit local S3 mirror.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: invoiceflow_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - pipeline_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U testuser -d invoiceflow_test
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: testuser
      RABBITMQ_DEFAULT_PASS: testpassword
    ports:
    - 127.0.0.1:5672:5672
    volumes:
    - pipeline_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 10s
      retries: 30
  ingest:
    build: &id001
      context: .
      dockerfile: services/pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql://testuser:testpassword@postgres:5432/invoiceflow_test
      RABBITMQ_URL: amqp://testuser:testpassword@rabbitmq:5672/
      PIPELINE_ROLE: ingest
      EXTRACTION_MODE: local_text
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET_INVOICES: invoices
      S3_BUCKET_PROCESSED: processed-invoices
    ports:
    - 127.0.0.1:8003:8000
    depends_on: &id002
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: &id003
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://localhost:8000/health/ready")
      interval: 3s
      timeout: 5s
      retries: 30
  extract:
    build: *id001
    environment:
      DATABASE_URL: postgresql://testuser:testpassword@postgres:5432/invoiceflow_test
      RABBITMQ_URL: amqp://testuser:testpassword@rabbitmq:5672/
      PIPELINE_ROLE: extract
      EXTRACTION_MODE: local_text
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET_INVOICES: invoices
      S3_BUCKET_PROCESSED: processed-invoices
    ports:
    - 127.0.0.1:8004:8000
    depends_on: *id002
    healthcheck: *id003
  match:
    build: *id001
    environment:
      DATABASE_URL: postgresql://testuser:testpassword@postgres:5432/invoiceflow_test
      RABBITMQ_URL: amqp://testuser:testpassword@rabbitmq:5672/
      PIPELINE_ROLE: match
      EXTRACTION_MODE: local_text
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET_INVOICES: invoices
      S3_BUCKET_PROCESSED: processed-invoices
    ports:
    - 127.0.0.1:8005:8000
    depends_on: *id002
    healthcheck: *id003
  localstack:
    image: localstack/localstack:4.13.1
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
    - 127.0.0.1:4566:4566
    healthcheck:
      test:
      - CMD
      - awslocal
      - s3
      - ls
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  pipeline_postgres: null
  pipeline_rabbitmq: null
