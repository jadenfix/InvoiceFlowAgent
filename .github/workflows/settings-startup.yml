name: Settings startup compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pydantic==2.5.0 python-dotenv==1.0.0 pytest
      - run: python -m pytest tests/test_settings_compatibility.py -q
